<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with Sky's agent</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f1115; color: #f2f3f5; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 16px 18px 10px; border-bottom: 1px solid #262a33; }
  header h1 { font-size: 19px; margin: 0 0 4px; }
  header p { margin: 0; font-size: 13px; color: #a7adba; line-height: 1.45; }
  header a { color: #7db4ff; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .agent { background: #1d2129; align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  #chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 14px 2px; }
  .chip { border: 1px solid #39404e; background: transparent; color: #cfd6e4; border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #262a33; }
  input { flex: 1; padding: 12px 14px; border-radius: 999px; border: 1px solid #39404e; background: #161a21; color: #f2f3f5; font-size: 15px; }
  button.send { padding: 0 18px; border: 0; border-radius: 999px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  footer { padding: 0 14px 10px; font-size: 12px; color: #7c8494; text-align: center; }
  footer a { color: #7db4ff; }
</style>
</head>
<body>
<header>
  <h1>Gagandeep Singh Pahuja &middot; &ldquo;Sky&rdquo;</h1>
  <p>NYU Tandon, MS Management of Technology &rsquo;27 &middot; VP, TechSHRM &middot; Aspiring product manager.
  This is Sky&rsquo;s agent. Ask it anything about his work, his projects, or how to reach him.</p>
</header>
<div id="chat"></div>
<div id="chips">
  <button class="chip" type="button">What is Sky building right now?</button>
  <button class="chip" type="button">What roles is he looking for?</button>
  <button class="chip" type="button">What did he do at TCS?</button>
  <button class="chip" type="button">How do I reach him?</button>
</div>
<form id="form">
  <input id="input" type="text" placeholder="Ask about Sky&hellip;" autocomplete="off" maxlength="500">
  <button class="send" type="submit">Send</button>
</form>
<footer>
  Prefer the human? <a href="https://www.linkedin.com/in/gdspahuja/">Connect on LinkedIn</a> &middot;
  <a href="https://gagan-git-sardar.github.io/gdspahuja/">Portfolio</a>
</footer>
<script>
// Set this to the deployed proxy URL (see README.md). Until then the page
// explains it is not live yet instead of failing silently.
const ENDPOINT = "https://sky-agent-proxy.REPLACE-ME.workers.dev/chat";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const history = [];
function add(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
add("Hi, I am Sky's agent. I can tell you about his work at NYU and TCS, the products he is building, and the roles he is looking for. What would you like to know?", "agent");
async function ask(text) {
  add(text, "user");
  history.push({ role: "user", text });
  const pending = add("Thinking\u2026", "agent");
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    const reply = data.reply || "Sorry, I could not answer that. You can reach Sky directly on LinkedIn.";
    pending.textContent = reply;
    history.push({ role: "agent", text: reply });
  } catch (e) {
    pending.textContent = "The chat is not live yet. Please reach Sky on LinkedIn: https://www.linkedin.com/in/gdspahuja/";
  }
  chat.scrollTop = chat.scrollHeight;
}
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  ask(text);
});
document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => ask(chip.textContent));
});
</script>
</body>
</html>
